[tools]
python = "3.11"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.test]
description = "Run the tests"
run = "python test.py"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf build dist *.egg-info"

[tasks.build]
description = "Build the sdist and wheel"
depends = ["clean"]
run = "uv build"

[tasks.publish]
description = "Upload the distributions to PyPI"
depends = ["build"]
run = "uv publish"
